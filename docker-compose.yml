services:
  app:
    build:
      dockerfile: Dockerfile
      context: .
    ports:
      - "8080:8080"
    env_file:
      - cmd/auction/.env
    command: sh -c "/auction"
    networks:
      - localNetwork

  test:
    build:
      dockerfile: Dockerfile
      context: .
    env_file:
      - cmd/auction/.env
    environment:
      - AUCTION_DURATION=2s
    entrypoint: ["go"]
    command: ["test", "-v", "-count=1", "./internal/usecase/auction_usecase/..."]
    networks:
      - localNetwork
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    env_file:
      - cmd/auction/.env
    volumes:
      - mongo-data:/data/db
    networks:
      - localNetwork
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
    driver: local

networks:
  localNetwork:
    driver: bridge